version: '3.8'

services:
  node1:
    build: .
    ports:
      - "9001:9001"
      - "10001:10001"
    command: ["EthNetLite", "9001"]
    networks:
      - ethnet

  node2:
    build: .
    ports:
      - "9002:9002"
      - "10002:10002"
    command: ["EthNetLite", "9002", "127.0.0.1:9001"]  # Bootstrap to node1
    depends_on:
      - node1
    networks:
      - ethnet

  node3:
    build: .
    ports:
      - "9003:9003"
      - "10003:10003"
    command: ["EthNetLite", "9003", "127.0.0.1:9001"]  # Bootstrap to node1
    depends_on:
      - node1
    networks:
      - ethnet

networks:
  ethnet:
    driver: bridge